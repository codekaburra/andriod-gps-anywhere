<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "SF Pro Display", -apple-system, "Helvetica Neue", Helvetica, "PingFang TC", Arial, sans-serif;
    background: #1d2c42;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1024px; height: 500px;
    background:
      radial-gradient(700px 420px at 78% 18%, rgba(63,169,164,0.20), transparent 62%),
      radial-gradient(560px 380px at 24% 96%, rgba(239,139,74,0.16), transparent 64%),
      linear-gradient(118deg, #16202f 0%, #1d2c42 46%, #223a52 100%);
    overflow: hidden;
  }
  .road { position: absolute; inset: 0; }
  .icon {
    position: absolute; left: 78px; top: 118px;
    width: 264px; height: 264px;
    border-radius: 60px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.07) inset;
  }
  .copy { position: absolute; left: 400px; top: 140px; width: 560px; }
  h1 {
    font-size: 76px; line-height: 1; font-weight: 700;
    letter-spacing: -1.6px; color: #fff;
  }
  .rule {
    width: 132px; height: 5px; border-radius: 3px; margin: 22px 0 20px;
    background: linear-gradient(90deg, #45b7b0, #ef8b4a);
  }
  p { font-size: 27px; line-height: 1.32; color: #b3c4d6; font-weight: 400; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip {
    font-size: 19px; font-weight: 500; color: #cfe4e2;
    padding: 9px 17px; border-radius: 999px;
    border: 1px solid rgba(69,183,176,0.5);
    background: rgba(69,183,176,0.11);
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="road" viewBox="0 0 1024 500" fill="none">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="1024" y2="0">
          <stop offset="0" stop-color="#8fa6bd" stop-opacity="0"/>
          <stop offset="0.35" stop-color="#cfe0ee" stop-opacity="0.42"/>
          <stop offset="1" stop-color="#ef8b4a" stop-opacity="0.30"/>
        </linearGradient>
      </defs>
      <path d="M-40 470 C 200 478, 360 442, 560 428 C 760 414, 900 404, 1080 398"
            stroke="url(#rg)" stroke-width="18" stroke-linecap="round"/>
      <path d="M-40 470 C 200 478, 360 442, 560 428 C 760 414, 900 404, 1080 398"
            stroke="#e9f2fa" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="18 26" stroke-linecap="round"/>
    </svg>
    <img class="icon" src="icon-512.png">
    <div class="copy">
      <h1>GPS Anywhere</h1>
      <div class="rule"></div>
      <p>為 App 測試模擬裝置定位</p>
      <div class="chips">
        <span class="chip">瞬移</span>
        <span class="chip">走路線</span>
        <span class="chip">速度控制</span>
      </div>
    </div>
  </div>
</body>
</html>
